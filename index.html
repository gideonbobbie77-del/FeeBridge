<!DOCTYPE html>
<html>
<head>
  <title>FEEBRIDGE Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:sans-serif;background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
    .box{background:#1e293b;padding:30px;border-radius:12px;width:90%;max-width:400px}
    input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;font-size:16px}
    button{background:#22c55e;color:white;font-weight:bold;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <h2>FEEBRIDGE</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="signup" type="button">Sign Up</button>
<button id="login" type="button">Login</button>
    <p id="msg" style="color:#f87171"></p>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
