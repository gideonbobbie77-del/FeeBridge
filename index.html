<!DOCTYPE html>
<html>
<head>
  <title>FEEBRIDGE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:#0f172a; color:white; display:flex; justify-content:center; align-items:center; height:100vh;">
  <div style="background:#1e293b; padding:30px; border-radius:10px;">
    <h2>FEEBRIDGE</h2>
    <input id="email" type="email" placeholder="Email" style="padding:10px; width:250px; margin:5px;"><br>
    <input id="password" type="password" placeholder="Password" style="padding:10px; width:250px; margin:5px;"><br>
    <button id="signup" style="padding:10px; width:250px; background:green; color:white; border:none;">Sign Up</button><br>
    <button id="login" style="padding:10px; width:250px; background:green; color:white; border:none; margin-top:5px;">Login</button>
    <p id="msg"></p>
  </div>

<script>
const SUPABASE_URL = https://vdpkpvvkrzolmvolwsek.supabase.co
const SUPABASE_ANON_KEY = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkcGtwdnZrcnpvbG12b2x3c2VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTQyNDksImV4cCI6MjEwNDI3MDI0OX0.zpIsevwplJ3jAjE2GAsE7tTGtfXpkaievPmcY4nL6P8

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

document.getElementById('signup').onclick = async () => {
  const email = document.getElementById('email').value
  const password = document.getElementById('password').value
  const { data, error } = await supabase.auth.signUp({email, password})
  if(error) { document.getElementById('msg').innerText = error.message }
  else { document.getElementById('msg').innerText = "Success! Check Supabase Users"; window.location = "dashboard.html" }
}

document.getElementById('login').onclick = async () => {
  const email = document.getElementById('email').value
  const password = document.getElementById('password').value
  const { data, error } = await supabase.auth.signInWithPassword({email, password})
  if(error) { document.getElementById('msg').innerText = error.message }
  else { window.location = "dashboard.html" }
}
</script>
</body>
</html>
